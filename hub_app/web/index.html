<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SchrobbeDock - Modulair Applicatie-ecosysteem">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Synchrone thema-detectie en pre-paint styling (direct vóór rendering) -->
  <script>
    (function() {
      try {
        var isDark = true;
        var primary = '#EA580C';
        var secondary = '#B45309';

        // Doorzoek alle localStorage-sleutels (ongeacht of ze 'flutter.' prefix hebben of niet)
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i) || '';
          var v = localStorage.getItem(k) || '';
          if (!v) continue;

          // 1. Check op JSON-blob (schrobbedock_theme_preferences)
          if (k.indexOf('theme_preferences') !== -1 || k.indexOf('schrobbedock') !== -1) {
            try {
              var p = typeof v === 'string' ? JSON.parse(v) : v;
              if (p.theme_mode === 'light') isDark = false;
              else if (p.theme_mode === 'dark') isDark = true;
              else if (p.theme_mode === 'system') {
                isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
              }
              if (p.primary_color) primary = p.primary_color;
              if (p.secondary_color) secondary = p.secondary_color;
            } catch(e) {}
          }

          // 2. Check op losse theme_mode sleutel
          if (k.indexOf('theme_mode') !== -1) {
            if (v.indexOf('light') !== -1) isDark = false;
            else if (v.indexOf('dark') !== -1) isDark = true;
            else if (v.indexOf('system') !== -1) {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          }

          // 3. Check op losse primary_color sleutel
          if (k.indexOf('primary_color') !== -1 || k.indexOf('primary') !== -1) {
            if (v.indexOf('#') !== -1) {
              var hexMatch = v.match(/#[0-9a-fA-F]{6}/);
              if (hexMatch) primary = hexMatch[0];
            } else if (v.indexOf('0x') !== -1 || v.indexOf('0X') !== -1) {
              primary = '#' + v.replace(/0x[0-9a-fA-F]{2}/i, '');
            }
          }

          // 4. Check op losse secondary_color sleutel
          if (k.indexOf('secondary_color') !== -1 || k.indexOf('secondary') !== -1) {
            if (v.indexOf('#') !== -1) {
              var hexMatch2 = v.match(/#[0-9a-fA-F]{6}/);
              if (hexMatch2) secondary = hexMatch2[0];
            }
          }
        }

        // Bepaal de definitieve achtergrond en contrastkleuren
        var bg = isDark ? '#0F172A' : '#F8FAFC';
        var textColor = isDark ? '#F8FAFC' : '#0F172A';
        var trackBorder = isDark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.12)';

        // Pas direct het html-element aan
        document.documentElement.style.backgroundColor = bg;

        // Injecteer de preboot stijlen direct in HEAD
        var styleEl = document.createElement('style');
        styleEl.id = 'schrobbedock-preboot-style';
        styleEl.textContent = 
          'html, body { background-color: ' + bg + ' !important; color: ' + textColor + ' !important; margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } ' +
          '#splash-logo { background: linear-gradient(135deg, ' + primary + ', ' + secondary + ') !important; } ' +
          '#splash-spinner { border-color: ' + trackBorder + ' !important; border-top-color: ' + primary + ' !important; }';
        document.head.appendChild(styleEl);
      } catch (e) {}
    })();
  </script>

  <style>
    /* Basis fallback stijlen voor de splash loader */
    #schrobbedock-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
      animation: pulse 1.8s infinite ease-in-out;
    }

    .splash-spinner {
      margin-top: 22px;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Verberg standaard browser progress indicator */
    .flutter-loader, [role="progressbar"] {
      display: none !important;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SchrobbeDock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SchrobbeDock Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="schrobbedock-splash">
    <div class="splash-logo" id="splash-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
    </div>
    <div class="splash-spinner" id="splash-spinner"></div>
  </div>

  <script>
    (function() {
      var removed = false;
      function removeSplash() {
        if (removed) return;
        removed = true;
        var splash = document.getElementById('schrobbedock-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 250);
        }
      }

      // 1. Officiële Flutter first frame listener
      window.addEventListener('flutter-first-frame', removeSplash);

      // 2. Snelle polling fallback (40ms)
      var checkInterval = setInterval(function() {
        if (document.querySelector('flutter-view, flt-glass-pane, canvas, flt-scene')) {
          clearInterval(checkInterval);
          removeSplash();
        }
      }, 40);

      // 3. Harde timeout (1200ms)
      setTimeout(function() {
        clearInterval(checkInterval);
        removeSplash();
      }, 1200);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

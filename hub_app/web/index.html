<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SchrobbeDock - Modulair Applicatie-ecosysteem">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Directe Dark Slate achtergrond - 100% gegarandeerd géén wit scherm */
    html, body {
      background-color: #0F172A !important;
      color: #F8FAFC;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* SchrobbeDock Splash Overlay */
    #schrobbedock-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    .splash-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
      animation: pulse 1.8s infinite ease-in-out;
    }

    .splash-spinner {
      margin-top: 24px;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Verberg standaard browser progress indicator */
    .flutter-loader, [role="progressbar"] {
      display: none !important;
    }
  </style>

  <!-- Dynamische synchronisatie met actieve gebruikersvoorkeuren vóór de eerste verfbeurt -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('flutter.schrobbedock_theme_preferences') || 
                  localStorage.getItem('schrobbedock_theme_preferences');
        
        var primary = '#EA580C';
        var secondary = '#B45309';
        var isLight = false;

        if (raw) {
          var p = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (p.primary_color) primary = p.primary_color;
          if (p.secondary_color) secondary = p.secondary_color;
          if (p.theme_mode === 'light') isLight = true;
        }

        var styleEl = document.createElement('style');
        styleEl.id = 'schrobbedock-theme-override';
        
        var css = '#splash-icon { background: linear-gradient(135deg, ' + primary + ', ' + secondary + ') !important; } ' +
                  '#splash-spinner { border-top-color: ' + primary + ' !important; } ';
        
        if (isLight) {
          css += 'html, body { background-color: #F8FAFC !important; color: #0F172A !important; } ' +
                 '.splash-spinner { border-color: rgba(0, 0, 0, 0.12) !important; border-top-color: ' + primary + ' !important; }';
        }
        
        styleEl.textContent = css;
        document.head.appendChild(styleEl);
      } catch (e) {}
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SchrobbeDock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SchrobbeDock Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Elegante Splash Scherm -->
  <div id="schrobbedock-splash">
    <div class="splash-logo" id="splash-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
    </div>
    <div class="splash-spinner" id="splash-spinner"></div>
  </div>

  <script>
    (function() {
      // Verberg splash vloeiend zodra Flutter engine de canvas/view toont
      var observer = new MutationObserver(function(mutations, obs) {
        var flutterView = document.querySelector('flutter-view, flt-glass-pane');
        if (flutterView) {
          setTimeout(function() {
            var splash = document.getElementById('schrobbedock-splash');
            if (splash) {
              splash.style.opacity = '0';
              setTimeout(function() { splash.remove(); }, 250);
            }
          }, 60);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

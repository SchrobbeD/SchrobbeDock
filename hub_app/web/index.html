<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SchrobbeDock - Modulair Applicatie-ecosysteem">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Directe Dark Slate achtergrond - 100% gegarandeerd géén wit scherm */
    html, body {
      background-color: #0F172A !important;
      color: #F8FAFC;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Subtiele Splash Overlay (nooit blokkerend) */
    #schrobbedock-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #EA580C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Verberg standaard debug loading bar */
    .flutter-loader, [role="progressbar"] {
      display: none !important;
    }
  </style>

  <!-- Dynamische themakleur voor spinner en lichte modus override indien gekozen -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('flutter.schrobbedock_theme_preferences') || 
                  localStorage.getItem('schrobbedock_theme_preferences');
        if (raw) {
          var p = typeof raw === 'string' ? JSON.parse(raw) : raw;
          var primary = p.primary_color || '#EA580C';
          var isLight = p.theme_mode === 'light';

          var styleEl = document.createElement('style');
          var css = '.splash-spinner { border-top-color: ' + primary + ' !important; } ';
          if (isLight) {
            css += 'html, body { background-color: #F8FAFC !important; color: #0F172A !important; } ' +
                   '.splash-spinner { border-color: rgba(0, 0, 0, 0.12) !important; border-top-color: ' + primary + ' !important; }';
          }
          styleEl.textContent = css;
          document.head.appendChild(styleEl);
        }
      } catch (e) {}
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SchrobbeDock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SchrobbeDock Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Subtiele laadindicator die NOOIT kan blijven hangen -->
  <div id="schrobbedock-splash">
    <div class="splash-spinner"></div>
  </div>

  <script>
    (function() {
      function removeSplash() {
        var splash = document.getElementById('schrobbedock-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 200);
        }
      }

      // 1. Actieve polling elke 40ms: verdwijnt direct zodra Flutter DOM zichtbaar is
      var checkInterval = setInterval(function() {
        if (document.querySelector('flutter-view, flt-glass-pane, canvas, flt-scene')) {
          clearInterval(checkInterval);
          removeSplash();
        }
      }, 40);

      // 2. Harde veiligheidstimeout: verdwijnt ALTIJD na maximaal 800ms
      setTimeout(function() {
        clearInterval(checkInterval);
        removeSplash();
      }, 800);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
